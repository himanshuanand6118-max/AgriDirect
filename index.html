function App(){
 const [page,setPage]=useState("home"),[role,setRole]=useState(null),[authMode,setAuthMode]=useState("signup"),[authUser,setAuthUser]=useState(null);
 const [consumerTab,setConsumerTab]=useState("market"),[farmerTab,setFarmerTab]=useState("overview"),[query,setQuery]=useState(""),[cat,setCat]=useState("All"),[cart,setCart]=useState([]),[modal,setModal]=useState(false);
 const [sharedListings,setSharedListings]=useState(()=>{
   try{const saved=JSON.parse(localStorage.getItem("fasalfresh_listings"));if(Array.isArray(saved)&&saved.length)return saved}catch(e){}
   return farmers.flatMap(f=>f.crops.map(c=>({...c,farmer:f})));
 });
 const [orders,setOrders]=useState(()=>{try{return JSON.parse(localStorage.getItem("fasalfresh_orders"))||[]}catch(e){return []}});
 const [notifications,setNotifications]=useState(()=>{try{return JSON.parse(localStorage.getItem("fasalfresh_notifications"))||[]}catch(e){return []}});
 useEffect(()=>{localStorage.setItem("fasalfresh_listings",JSON.stringify(sharedListings))},[sharedListings]);
 useEffect(()=>{localStorage.setItem("fasalfresh_orders",JSON.stringify(orders))},[orders]);
 useEffect(()=>{localStorage.setItem("fasalfresh_notifications",JSON.stringify(notifications))},[notifications]);
 const listings=sharedListings;
 const filtered=listings.filter(x=>(cat==="All"||x.cat===cat)&&x.name.toLowerCase().includes(query.toLowerCase()));
 const openRole=r=>{setRole(r);setAuthMode("signup");setPage("auth")};
 const addToCart=item=>setCart(c=>{const found=c.find(x=>x.key===item.farmer.id+"-"+item.id);if(found)return c.map(x=>x.key===found.key?{...x,count:x.count+1}:x);return [...c,{...item,key:item.farmer.id+"-"+item.id,count:1}]});
  const updateCartQty=(key,delta)=>setCart(c=>c.map(x=>x.key===key?{...x,count:Math.max(0,x.count+delta)}:x).filter(x=>x.count>0));
  const removeFromCart=key=>setCart(c=>c.filter(x=>x.key!==key));
 const total=cart.reduce((sum,x)=>sum+x.price*x.count,0);
 const notify=(text,orderId)=>setNotifications(n=>[{id:Date.now()+Math.random(),text,orderId,roles:["consumer","farmer"],read:false},...n].slice(0,30));
 const placeOrder=()=>{if(!cart.length)return;const base="KS-"+Math.floor(10000+Math.random()*89999);const grouped={};cart.forEach(x=>(grouped[x.farmer.id]??=[]).push(x));const created=Object.entries(grouped).map(([farmerId,items],i)=>{const id=i?base+"-"+i:base;return{id,items:items.map(x=>x.name+" • "+x.count+" kg").join(" • "),amount:items.reduce((a,x)=>a+x.price*x.count,0)+(i===0?30:0),status:"Order placed",eta:"Preparing",date:"Today",farmerId,trackingId:"FFRESH-TRK-"+id.slice(3),itemsData:items}});setOrders(o=>[...created,...o]);created.forEach(o=>notify("Order "+o.id+" placed successfully",o.id));setCart([]);setModal(false)};
 return <div className="min-h-screen">
  {page==="home"&&<Home onRole={openRole}/>}
  {page==="auth"&&<Auth role={role} mode={authMode} setMode={setAuthMode} onBack={()=>setPage("home")} onSuccess={u=>{setAuthUser(u);setPage("dashboard")}}/>}
  {page==="dashboard"&&role==="consumer"&&<Consumer user={authUser} filtered={filtered} query={query} setQuery={setQuery} cat={cat} setCat={setCat} addToCart={addToCart} updateCartQty={updateCartQty} removeFromCart={removeFromCart} cart={cart} total={total} onCheckout={()=>setModal(true)} tab={consumerTab} setTab={setConsumerTab} orders={orders} notifications={notifications} setNotifications={setNotifications} onBack={()=>setPage("home")}/>}
  {page==="dashboard"&&role==="farmer"&&<Farmer user={authUser} tab={farmerTab} setTab={setFarmerTab} onBack={()=>setPage("home")} onLogout={()=>{setRole(null);setPage("home")}} sharedListings={sharedListings} setSharedListings={setSharedListings} orders={orders} setOrders={setOrders} notifications={notifications} setNotifications={setNotifications}/>} 
  {modal&&<Checkout cart={cart} total={total} close={()=>setModal(false)} done={placeOrder}/>} 
 </div>
}

function Auth({role,mode,setMode,onBack,onSuccess}){
 const [step,setStep]=useState("phone");
 const [phone,setPhone]=useState("");
 const [otp,setOtp]=useState("");
 const [demoOtp,setDemoOtp]=useState("");
 const [name,setName]=useState("");
 const [city,setCity]=useState("Pune");
 const [address,setAddress]=useState("");
 const [aadhaar,setAadhaar]=useState("");
 const [kycVerified,setKycVerified]=useState(false);
 const [error,setError]=useState("");
 const [loading,setLoading]=useState(false);

 const verifyKyc=()=>{
   const digits=aadhaar.replace(/\D/g,"");
   if(digits.length!==12){setError("Enter a valid 12-digit Aadhaar number.");return}
   setKycVerified(true);setError("");
 };

 const sendOtp=()=>{
   if(phone.length!==10){setError("Enter a valid 10-digit mobile number.");return}
   const code=String(Math.floor(1000+Math.random()*9000));
   setDemoOtp(code);setOtp("");setError("");setLoading(true);
   setTimeout(()=>{setLoading(false);setStep("otp")},650);
 };

 const verify=()=>{
   if(otp!==demoOtp){setError("Invalid OTP. Please try again.");return}
   setError("");
   if(mode==="login"){
     try{
       const accounts=JSON.parse(localStorage.getItem("fasalfresh_accounts")||"{}");
       const saved=accounts[role]?.[phone];
       if(saved){onSuccess(saved);return}
     }catch(e){}
     setError("No account found for this mobile number. Please sign up first.");
     return;
   }
   setStep("details");
 };

 const finish=()=>{
   if(!name.trim()||!address.trim()){setError("Please complete your profile.");return}
    if(role==="farmer"&&!kycVerified){setError("Please verify your 12-digit Aadhaar for farmer KYC.");return}
   const user={name:name.trim(),phone,city,address,role,kycVerified:role==="farmer"};
   try{
     const accounts=JSON.parse(localStorage.getItem("fasalfresh_accounts")||"{}");
     accounts[role]=accounts[role]||{};
     accounts[role][phone]=user;
     localStorage.setItem("fasalfresh_accounts",JSON.stringify(accounts));
   }catch(e){}
   onSuccess(user);
 };

 return <div className="min-h-screen bg-[#f6f8f5]">
   <div className="max-w-6xl mx-auto min-h-screen grid lg:grid-cols-2">
    <div className="hidden lg:flex bg-[#102218] text-white p-12 flex-col justify-between relative overflow-hidden">
      <div className="absolute -top-20 -right-20 w-80 h-80 rounded-full bg-emerald-500/20 blur-3xl"/>

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + Number(days || 0));
  return d;
}
function dateInputValue(d = new Date()) {
  return new Date(d).toISOString().slice(0,10);
}
function daysLeft(date) {
  return Math.ceil((new Date(date) - new Date()) / 86400000);
}
function demandForCrop(crop) {
  return DEMAND_SUGGESTIONS[crop] || { demand: "Medium", trend: "+5%", reason: "Use recent local sales to tune your listing.", buyWindow: "Next 5–7 days" };
}

function CropVisionInspection() {
  const [file, setFile] = React.useState(null);
  const [score, setScore] = React.useState(null);
  const [status, setStatus] = React.useState("Load a crop image for a client-side visual inspection.");
  const [loading, setLoading] = React.useState(false);
  const runInspection = async () => {
    if (!file) return;
    setLoading(true); setStatus("Loading MobileNet model…");
    try {
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; });
      const model = await mobilenet.load();
      const predictions = await model.classify(img);
      // MobileNet is a generic image classifier, not an agricultural disease detector.
      // Use its confidence only as a demo visual-signal proxy, not a scientific crop-health diagnosis.
      const confidence = predictions.length ? predictions[0].probability : 0.5;
      const visualScore = Math.max(35, Math.min(98, Math.round(55 + confidence * 43)));
      setScore(visualScore);
      setStatus("Client-side MobileNet inspection complete.");
    } catch (e) {
      setStatus("Could not inspect this image. Try a JPG/PNG photo.");
      setScore(null);
    } finally { setLoading(false); }
  };
  return <div className="rounded-2xl border border-sky-100 bg-sky-50 p-4 mt-4">
    <div className="flex items-center gap-2 font-bold text-sky-900"><Camera size={19}/> AI Crop Health / Freshness</div>
    <p className="text-xs text-slate-600 mt-1">Runs in the browser with TensorFlow.js + MobileNet. This is a visual proxy score, not a certified disease/freshness test.</p>
    <div className="flex gap-2 mt-3 items-center">
      <label className="cursor-pointer px-3 py-2 rounded-xl bg-white border font-semibold text-sm flex items-center gap-2"><Upload size={16}/> Choose image
        <input type="file" accept="image/*" className="hidden" onChange={e=>setFile(e.target.files?.[0]||null)}/>
      </label>
      <button onClick={runInspection} disabled={!file||loading} className="px-4 py-2 rounded-xl bg-sky-600 disabled:opacity-50 text-white font-semibold text-sm">{loading?"Inspecting…":"Inspect crop"}</button>
    </div>
    {score !== null && <div className="mt-3 flex items-center gap-4"><div className="text-3xl font-black text-sky-700">{score}/100</div><div><div className="font-bold">Visual quality proxy</div><div className="text-xs text-slate-600">{status}</div></div></div>}
    {score === null && <div className="text-xs mt-2 text-slate-500">{status}</div>}
  </div>
}

  setList(l=>l.filter((_,j)=>j!==i));
  if(itemToRemove?.id)setSharedListings(l=>l.filter(x=>x.id!==itemToRemove.id));
}} className="text-slate-300 hover:text-rose-500"><Trash2 size={16}/></button></div>)}</div></section><aside className="space-y-4"><div className="bg-white rounded-3xl border border-slate-100 p-5 shadow-sm"><div className="flex items-center gap-2"><Plus size={17} className="text-emerald-700"/><h2 className="font-bold">Add produce</h2></div><div className="space-y-3 mt-4"><select value={crop} onChange={e=>{const v=e.target.value;setCrop(v);setShelfDays(SHELF_LIFE_DAYS[v]||14)}} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm">{crops.map(c=><option key={c.name}>{c.name}</option>)}</select><div className="grid grid-cols-2 gap-2"><input value={qty} onChange={e=>setQty(e.target.value.replace(/\D/g,""))} placeholder="Quantity kg" className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm outline-none"/><input value={price} onChange={e=>setPrice(e.target.value.replace(/\D/g,""))} placeholder="Price / kg" className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm outline-none"/></div><label className="mt-3 cursor-pointer rounded-xl border-2 border-dashed border-emerald-200 bg-emerald-50 p-3 flex items-center gap-3">{photo?<img src={photo} alt="Crop preview" className="w-16 h-16 rounded-xl object-cover"/>:<div className="w-16 h-16 rounded-xl bg-white grid place-items-center"><Camera size={22} className="text-emerald-600"/></div>}<div><p className="text-xs font-extrabold text-emerald-900">{photo?"Change product photo":"Upload product photo"}</p><p className="text-[10px] text-slate-500 mt-1">This photo will appear in the marketplace</p></div><input type="file" accept="image/*" className="hidden" onChange={e=>{const f=e.target.files?.[0];if(f)setPhoto(URL.createObjectURL(f))}}/></label><div className="grid grid-cols-2 gap-2"><label className="text-[11px] font-bold text-slate-600">Date of listing<input type="date" value={listingDate} onChange={e=>setListingDate(e.target.value)} className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm font-normal"/></label><label className="text-[11px] font-bold text-slate-600">Shelf life (days)<input type="number" min="1" value={shelfDays} onChange={e=>setShelfDays(Math.max(1,Number(e.target.value)||1))} className="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm font-normal"/></label></div><div className="rounded-2xl bg-emerald-50 border border-emerald-100 p-4">
<div className="flex items-center gap-2"><BarChart3 size={16} className="text-emerald-700"/><p className="text-xs font-extrabold text-emerald-900">AI Price Predictor (Client-side demo)</p></div>
<p className="text-[10px] text-slate-500 mt-1">Suggested fair selling price while you list this crop.</p>
<div className="flex items-end justify-between mt-3"><div><p className="text-[9px] text-slate-400">AI suggested price</p><p className="font-mono text-2xl font-extrabold text-emerald-800">₹{Math.round((crops.find(x=>x.name===crop)?.price||25)*1.08)}/kg</p></div>
<button type="button" onClick={()=>setPrice(String(Math.round((crops.find(x=>x.name===crop)?.price||25)*1.08)))} className="px-3 py-2 rounded-xl bg-white border border-emerald-200 text-[10px] font-extrabold text-emerald-700">Use AI price</button></div>
</div>
<div className="rounded-xl bg-slate-50 border border-slate-100 p-3 text-[10px] text-slate-600"><b>Expiry preview:</b> {addDays(listingDate,shelfDays).toLocaleDateString()} • {Math.max(0,daysLeft(addDays(listingDate,shelfDays)))} days remaining</div><button onClick={add} className="w-full bg-emerald-700 text-white rounded-xl py-3 font-extrabold text-sm">Publish listing</button></div></div><Advisory/></aside></div>}
   {tab==="sales"&&<Sales orders={orders} setOrders={setOrders} notifications={notifications} setNotifications={setNotifications} farmerId={farmerId}/>}
   {tab==="wallet"&&<Wallet balance={balance} addMoney={()=>setBalance(b=>b+500)}/>}
   {tab==="advisory"&&<div className="mt-7 max-w-2xl"><Advisory large/></div>}
  </main>
 </div>
}
function Sales({orders,setOrders,setNotifications,farmerId}){
 const farmerOrders=orders.filter(o=>String(o.farmerId)===String(farmerId));
 const update=(o,status,eta)=>{setOrders(all=>all.map(x=>x.id===o.id?{...x,status,eta}:x));setNotifications(n=>[{id:Date.now()+Math.random(),text:`Order ${o.id}: ${status}`,orderId:o.id,roles:["consumer","farmer"],read:false},...n].slice(0,30))};
 return <div className="mt-7 bg-white rounded-3xl border border-slate-100 overflow-hidden"><div className="p-5 border-b border-slate-100"><p className="text-xs uppercase tracking-widest text-emerald-700 font-bold">Farmer revenue</p><h2 className="font-display text-2xl font-extrabold mt-1">My Sales</h2></div><div className="divide-y divide-slate-100">{farmerOrders.length===0&&<div className="p-8 text-center text-xs text-slate-400">No sales yet. Orders for your listed produce will appear here.</div>}{farmerOrders.map(s=><div key={s.id} className="p-5 flex flex-col sm:flex-row sm:items-center gap-4"><div className="w-11 h-11 rounded-xl bg-emerald-50 grid place-items-center"><PackageCheck size={18} className="text-emerald-700"/></div><div className="flex-1"><p className="text-sm font-bold">{s.items}</p><p className="text-xs text-slate-400 mt-1">{s.id} • Buyer order</p><p className="text-[9px] text-slate-400 font-mono mt-1">Tracking: {s.trackingId||"—"}</p></div><div className="text-left sm:text-right"><p className="font-mono font-bold">{money(s.amount)}</p><p className="text-[10px] text-emerald-700 font-bold mt-1">{s.status}</p><div className="flex gap-2 mt-2 justify-end"><button onClick={()=>update(s,"Accepted","Preparing")} className="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 text-[9px] font-bold">Accept</button><button onClick={()=>update(s,"Packed","Ready for pickup")} className="px-2 py-1 rounded-lg bg-amber-50 text-amber-800 text-[9px] font-bold">Packed</button><button onClick={()=>update(s,"Out for delivery","On the way")} className="px-2 py-1 rounded-lg bg-slate-900 text-white text-[9px] font-bold">Dispatch</button><button onClick={()=>update(s,"Delivered","Delivered")} className="px-2 py-1 rounded-lg bg-emerald-700 text-white text-[9px] font-bold">Delivered</button></div></div></div>)}</div></div>
}
function Advisory({large=false}){
 return <div className={"bg-white border border-slate-100 rounded-3xl p-5 "+(large?"shadow-sm":"")}><div className="flex items-center gap-2"><Sun size={18} className="text-amber-500"/><p className="font-bold">Weather & Crop Advisory</p></div><div className="grid grid-cols-2 gap-3 mt-4"><div className="bg-sky-50 rounded-2xl p-4"><p className="text-xs text-slate-500">Next 24h</p><p className="font-mono text-2xl font-bold mt-1">29°C</p><p className="text-[10px] text-slate-500 mt-1">Partly cloudy • Rain 20%</p></div><div className="bg-emerald-50 rounded-2xl p-4"><p className="text-xs text-slate-500">Field signal</p><p className="font-bold mt-1">Good</p><p className="text-[10px] text-slate-500 mt-1">Harvest & transport window</p></div></div><div className="mt-4 p-4 rounded-2xl bg-amber-50 border border-amber-100"><p className="text-xs font-bold text-amber-900">AI crop advisory</p><p className="text-xs text-slate-600 leading-5 mt-1">Keep harvested produce shaded, avoid unnecessary moisture, and schedule dispatch during cooler hours.</p></div></div>
}

function Checkout({cart,total,close,done}){
 const [step,setStep]=useState(1);
 return <div className="fixed inset-0 z-50 bg-slate-950/55 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-5">
  <div className="bg-white w-full sm:max-w-lg sm:rounded-3xl rounded-t-3xl overflow-hidden shadow-2xl">
   <div className="bg-[#102218] text-white px-5 py-4 flex items-center justify-between"><div><p className="text-[10px] uppercase tracking-widest text-emerald-300 font-bold">Secure checkout</p><h2 className="font-display text-xl font-bold">Complete your order</h2></div>{step<3&&<button onClick={close}><X/></button>}</div>
   {step===1&&<div className="p-5"><div className="space-y-3">{cart.map(x=><div key={x.key} className="flex items-center gap-3"><span className="text-2xl">{x.emoji}</span><div className="flex-1"><p className="text-sm font-bold">{x.name}</p><p className="text-xs text-slate-500">{x.farmer.name} • {x.count} kg</p></div><span className="font-mono text-sm font-bold">{money(x.price*x.count)}</span></div>)}</div><div className="border-t border-slate-100 mt-5 pt-4 flex justify-between"><span className="text-sm text-slate-500">Order total</span><span className="font-mono font-extrabold text-lg">{money(total+30)}</span></div><button onClick={()=>setStep(2)} className="w-full mt-5 bg-emerald-700 text-white rounded-xl py-3.5 font-extrabold">Continue to payment</button></div>}
   {step===2&&<div className="p-5"><p className="text-sm font-bold">Payment method</p><div className="grid gap-3 mt-4"><button onClick={()=>setStep(3)} className="border-2 border-emerald-700 bg-emerald-50 rounded-2xl p-4 text-left flex items-center gap-3"><WalletCards className="text-emerald-700"/><div><p className="text-sm font-bold">UPI / Card</p><p className="text-xs text-slate-500">Secure demo payment</p></div><ChevronRight className="ml-auto"/></button><button onClick={()=>setStep(3)} className="border border-slate-200 rounded-2xl p-4 text-left flex items-center gap-3"><IndianRupee/><div><p className="text-sm font-bold">Cash on delivery</p><p className="text-xs text-slate-500">Pay when your order arrives</p></div><ChevronRight className="ml-auto"/></button></div></div>}
   {step===3&&<div className="p-8 text-center"><div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 grid place-items-center mx-auto"><CheckCircle2 size={34}/></div><h3 className="font-display text-2xl font-extrabold mt-5">Order placed!</h3><p className="text-sm text-slate-500 mt-2">Your farmers have been notified. Delivery updates will appear shortly.</p><div className="mt-4 rounded-2xl bg-emerald-50 border border-emerald-100 p-3"><p className="text-[10px] uppercase tracking-wider text-emerald-700 font-bold">Delivery tracking number</p><p className="font-mono font-extrabold text-emerald-900 mt-1">FFRESH-TRK-{String(Math.floor(10000+Math.random()*89999))}</p></div><button onClick={done} className="mt-6 w-full bg-emerald-700 text-white rounded-xl py-3 font-extrabold">Back to marketplace</button></div>}
  </div>
 </div>
}

createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
